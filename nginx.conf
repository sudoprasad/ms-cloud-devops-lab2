server {
    listen 80;

    # Close the connection after every response. Browsers otherwise reuse one
    # connection, and every request would land on the same Pod.
    keepalive_timeout 0;

    root /usr/share/nginx/html;

    # Reply with this container's hostname. In Kubernetes that is the Pod name.
    location = /whoami {
        default_type text/plain;
        add_header Cache-Control no-store;
        return 200 "$hostname\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
